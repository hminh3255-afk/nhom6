<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhóm 6 - Cửa Hàng Đồ Ăn Vặt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#ff6b00;color:white;text-align:center;padding:25px}
.banner img{width:100%;max-height:450px;object-fit:cover}
.section-title{text-align:center;color:#ff6b00;margin:30px 0}
.products{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;padding:20px}
.card{width:250px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover}
.card-content{padding:15px;text-align:center}
.price{color:red;font-weight:bold;margin:10px 0}
.team{width:90%;margin:30px auto;background:white;padding:25px;border-radius:12px}
.team-group{display:block;margin:20px auto;width:100%;max-width:800px;border-radius:12px}
.members{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:20px}
.member{width:220px;text-align:center}
.member img{width:200px;height:240px;object-fit:cover;border-radius:10px}
footer{background:#333;color:white;text-align:center;padding:15px;margin-top:20px}
</style>
</head>
<body>
<header>
<h1>🍟 CỬA HÀNG ĐỒ ĂN VẶT NHÓM 6 🍟</h1>
<p>Website môn Tin học 4</p>
</header>

<h2 class="section-title">SẢN PHẨM NỔI BẬT</h2>

<div class="products">
<div class="card"><img src="https://images.unsplash.com/photo-1561758033-d89a9ad46330"><div class="card-content"><h3>Gà Rán</h3><p class="price">45.000 VNĐ</p></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1585238342024-78d387f4a707"><div class="card-content"><h3>Khoai Tây Chiên</h3><p class="price">25.000 VNĐ</p></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd"><div class="card-content"><h3>Pizza Mini</h3><p class="price">60.000 VNĐ</p></div></div>
</div>

<section class="team">
<h2 style="text-align:center;color:#ff6b00">THÔNG TIN NHÓM 6</h2>

<img src="anhnhom.png" class="team-group" alt="Ảnh nhóm">

<div class="members">
<div class="member">
<img src="minh.png" alt="Minh">
<h3>Cao Xuân Hải Minh</h3>
</div>

<div class="member">
<img src="khai.jpg" alt="Khải">
<h3>Lã Ngọc Khải</h3>
</div>

<div class="member">
<img src="hung.png" alt="Hưng">
<h3>Trần Tuấn Hưng</h3>
</div>

<div class="member">
<img src="son.jpg" alt="Sơn">
<h3>Ngô Trường Sơn</h3>
</div>
</div>
</section>

<footer>
© 2026 - Nhóm 6 - Môn Tin học 4
</footer>
</body>
</html>
